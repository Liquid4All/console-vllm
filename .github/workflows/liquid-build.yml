name: Build and publish Liquid vLLM image

on:
  push:
    tags:
      - "v*-liquid.*"

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/liquid4all/console-vllm

jobs:
  build-and-push:
    # Blacksmith runner for speed. We use standard buildx (not the sticky-disk
    # Docker cache) because the sticky-disk buildkit store corrupted the ~4 GB
    # base layer on commit ("unexpected commit digest"). Reliability over cache.
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4

      # Auth uses the automatic GITHUB_TOKEN; no registry secrets to configure.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.liquid
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:latest
