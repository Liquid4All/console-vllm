name: Build and publish Liquid vLLM image

on:
  push:
    tags:
      - "v*-liquid.*"

permissions:
  contents: read

env:
  IMAGE: us-west1-docker.pkg.dev/liquid-registry/images/console-vllm

jobs:
  build-and-push:
    # Blacksmith runner for speed; standard buildx (the sticky-disk Docker cache
    # corrupted the large base layer on commit).
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4

      # Auth to Google Artifact Registry with a service-account key.
      # GCP_SA_KEY = the JSON key for an SA with roles/artifactregistry.writer
      # on the 'images' repo. Username is the literal string _json_key.
      - uses: docker/login-action@v3
        with:
          registry: us-west1-docker.pkg.dev
          username: _json_key
          password: ${{ secrets.GCP_SA_KEY }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: vllm-openai
          push: true
          build-args: |
            VLLM_BUILD_COMMIT=${{ github.sha }}
            VLLM_BUILD_PIPELINE=github-actions
            VLLM_BUILD_URL=https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
            VLLM_IMAGE_TAG=${{ github.ref_name }}
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:latest
