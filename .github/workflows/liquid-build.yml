name: Build and publish Liquid vLLM image

on:
  push:
    tags:
      - "v*-liquid.*"

permissions:
  contents: read

env:
  # Docker Hub target. Set as an Actions *variable* (Settings → Secrets and
  # variables → Actions → Variables), e.g. DOCKERHUB_NAMESPACE = your org.
  IMAGE: ${{ vars.DOCKERHUB_NAMESPACE }}/console-vllm

jobs:
  build-and-push:
    # Blacksmith runner for speed; standard buildx (the sticky-disk Docker cache
    # corrupted the large base layer on commit).
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4

      # Logs in to Docker Hub (default registry). Add DOCKERHUB_USERNAME and
      # DOCKERHUB_TOKEN (Read & Write access token) as repo/org secrets.
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.liquid
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:latest
